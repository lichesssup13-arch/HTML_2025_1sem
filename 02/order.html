   <h1 align="center">Кофейня "Уютный уголок"</h1>

      <!-- Раздел 5: Форма заказа -->

 <div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <h2 class="text-center fs-5 text-warning 4">Онлайн заказ</h2>
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form action="https://www.bing.com/search?" id="UserEnter" name="UserEnter" target="_blank">
                        <input type="hidden" name="q" value="search" />
                        
                        <h5 class="fw-bold text-warning mb-3">Введите данные:</h5>

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" placeholder="Введите ваше имя" aria-label="Username" value="Кирилл Пирожков" />
                        </div>

                        <div class="mb-3">
                            <label for="order_date" class="fw-semibold text-warning mb-2">Дата получения заказа:</label>
                            <input type="date" class="form-control" id="order_date" name="order_date">
                        </div>

                        <div class="mb-3">
                            <p class="fw-semibold text-warning mb-2">Выберите напиток:</p>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="espresso" name="drink" value="espresso">
                                <label class="form-check-label" for="espresso">
                                    Эспрессо (180 ₽)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="americano" name="drink" value="americano">
                                <label class="form-check-label" for="americano">
                                    Американо (200 ₽)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="cappuccino" name="drink" value="cappuccino" checked>
                                <label class="form-check-label" for="cappuccino">
                                    Капучино (250 ₽)
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <p class="fw-semibold text-warning mb-2">Добавки:</p>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="milk" value="milk">
                                <label class="form-check-label" for="milk">
                                    Молоко (30 ₽)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="cinnamon" name="additives" value="cinnamon" checked>
                                <label class="form-check-label" for="cinnamon">
                                    Корица (20 ₽)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="syrup" name="additives" checked>
                                <label class="form-check-label" for="syrup">
                                    Сироп (40 ₽)
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label fw-semibold">Количество:</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" min="1" max="10" value="1" required style="max-width: 120px;">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Пароль для изменения заказа:</label>
                            <input type="password" class="form-control" id="password" name="password" style="max-width: 250px;">
                        </div>

                        <div class="mb-4">
                            <label for="comment" class="form-label fw-semibold">Комментарий к заказу:</label>
                            <textarea class="form-control" id="comment" aria-label="Комментарий" rows="3"></textarea>
                        </div>

                        <input type="hidden" name="function" value="page" />
                        <input type="hidden" name="page_id" value="3" />

                        <div class="d-flex gap-3 justify-content-end">
                            <input type="reset" class="btn btn-outline-secondary" name="Reset" value="Обновить">
                            <input type="submit" class="btn btn-warning" name="submit" value="Отправить заказ">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
